version: '3.8'

services:
  bot:
    build: .
    container_name: ai-services-bot
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - config/.env
    restart: unless-stopped
    command: tail -f /dev/null  # Keep container running

  # Optional: Add PostgreSQL if scaling beyond SQLite
